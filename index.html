<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap');

  :root{
    --ivory: #F3EADA;
    --ivory-2: #EDE1CB;
    --ivory-deep: #E2D2AF;
    --ink: #241C13;
    --ink-soft: #4d4231;
    --gold: #B08A4E;
    --gold-bright: #F0D9A0;
    --gold-line: rgba(176,138,78,0.55);
    --gold-line-soft: rgba(176,138,78,0.3);
    --watermark: #a9946c;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{ margin:0; padding:0; width:100%; height:100%; background: var(--ivory); overflow:hidden; }

  body{ font-family:'Cormorant Garamond', serif; color: var(--ink); }

  .invitation{
    position:relative; width:100%; height:100vh; height:100dvh;
    overflow:hidden; cursor:pointer; background: var(--ivory);
  }

  .sprite{ position:absolute; width:0; height:0; }

  .field{
    position:absolute; inset:0;
    background:
      radial-gradient(115% 80% at 45% 28%, #FBF4E4 0%, var(--ivory) 44%, var(--ivory-2) 76%, var(--ivory-deep) 100%);
  }

  .texture{
    position:absolute; inset:0; opacity:0.5; mix-blend-mode: multiply; pointer-events:none;
    background-image:
      repeating-linear-gradient(115deg, rgba(77,66,49,0.03) 0px, rgba(77,66,49,0.03) 1px, transparent 1px, transparent 3px),
      radial-gradient(rgba(36,28,19,0.06) 1px, transparent 1px);
    background-size: auto, 2.6px 2.6px;
  }

  .rays{
    position:absolute; inset:-10%; pointer-events:none; mix-blend-mode: screen; opacity:0.55;
    background:
      linear-gradient(115deg, rgba(255,247,224,0) 30%, rgba(255,244,210,0.55) 42%, rgba(255,244,210,0) 54%),
      linear-gradient(122deg, rgba(255,244,210,0) 58%, rgba(255,238,190,0.35) 66%, rgba(255,244,210,0) 74%);
    animation: rayDrift 16s ease-in-out infinite;
    transform-origin: 20% 10%;
  }

  @keyframes rayDrift{
    0%,100%{ transform: translate(0,0) rotate(0deg); opacity:0.5; }
    50%{ transform: translate(-2%,1.5%) rotate(0.6deg); opacity:0.68; }
  }

  .vignette{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(120% 92% at 50% 50%, transparent 52%, rgba(36,28,19,0.16) 100%);
    animation: vignetteBreathe 12s ease-in-out infinite;
  }

  @keyframes vignetteBreathe{
    0%,100%{ opacity: 0.9; }
    50%{ opacity: 1; }
  }

  .bloom{
    position:absolute; width:min(90vw,760px); height:min(90vw,760px); left:50%; top:44%;
    transform: translate(-50%,-50%) scale(1);
    background: radial-gradient(circle, rgba(176,138,78,0.18) 0%, rgba(176,138,78,0) 66%);
    opacity:0.65; transition: opacity 1.4s ease, transform 1.4s ease; pointer-events:none; filter: blur(3px);
    z-index:2;
  }
  .invitation.lit .bloom{ opacity:1; transform: translate(-50%,-50%) scale(1.55); }

  .frame{
    position:absolute; inset: 3.4vh 5vw; pointer-events:none; z-index:3;
    transition: opacity 1s ease, filter 1.2s ease;
  }
  .frame svg{ width:100%; height:100%; display:block; overflow:visible; }
  .frame .edge{ fill:none; stroke: var(--gold-line-soft); stroke-width:1; }
  .frame .glint{
    fill:none; stroke: var(--gold-bright); stroke-width:1.1; opacity:0.85;
    stroke-dasharray: 26 900; stroke-dashoffset:0;
    animation: travel 9s linear infinite;
  }
  @keyframes travel{ to{ stroke-dashoffset: -926; } }

  .frame .corner-mark{ fill: var(--gold); }

  .invitation.lit .frame{ filter: drop-shadow(0 0 5px rgba(176,138,78,0.4)); }
  .invitation.dissolving .frame{ opacity:0; }

  .branch{ position:absolute; width: clamp(96px,26vw,170px); height:auto; opacity:0; z-index:3;
    transition: opacity 1.6s ease 0.1s, filter 1.2s ease; }
  .invitation.revealed .branch{ opacity:0.85; }
  .invitation.lit .branch{ filter: drop-shadow(0 0 6px rgba(176,138,78,0.45)); }
  .invitation.dissolving .branch{ opacity:0; transition: opacity 1s ease; }

  .branch .stem{ fill:none; stroke: var(--gold); stroke-width:1.1; opacity:0.75; }
  .branch .leaf{ fill: rgba(176,138,78,0.12); stroke: var(--gold); stroke-width:0.9; opacity:0.8; }
  .branch .vein{ stroke: var(--gold); stroke-width:0.6; opacity:0.6; fill:none; }
  .branch .berry{ fill: var(--gold); opacity:0.75; stroke:none; }

  .branch.tl{ top: calc(1.6vh + var(--safe-t)); left: 2vw; }
  .branch.tr{ top: calc(1.6vh + var(--safe-t)); right: 2vw; transform: scaleX(-1); }
  .branch.bl{ bottom: calc(1.6vh + var(--safe-b)); left: 2vw; transform: scaleY(-1); }
  .branch.br{ bottom: calc(1.6vh + var(--safe-b)); right: 2vw; transform: scale(-1,-1); }

  .foreground-leaf{ position:absolute; z-index:8; opacity:0.35; filter: blur(5px); pointer-events:none;
    transition: opacity 1.1s ease; }
  .foreground-leaf svg{ display:block; }
  .foreground-leaf .leaf{ fill:#2c2418; stroke:none; }
  .foreground-leaf.left{ left:-8%; top:38%; width:34vw; transform: rotate(-12deg); }
  .foreground-leaf.right{ right:-10%; bottom:-2%; width:40vw; transform: rotate(8deg) scaleX(-1); }
  .invitation.dissolving .foreground-leaf{ opacity:0; }

  .names-block{ position:relative; display:flex; flex-direction:column; align-items:center; }

  .monogram{
    position:absolute; left:50%; top:50%; transform: translate(-50%,-50%);
    display:flex; align-items:center; justify-content:space-between; gap: clamp(1.4rem,10vw,3.2rem);
    width: 116%;
    font-family:'Playfair Display', serif; font-weight:700;
    font-size: clamp(7.2rem, 36vw, 14.5rem); line-height:1; color: var(--watermark);
    opacity:0.05; z-index:0; pointer-events:none; user-select:none;
    animation: markBreathe 11s ease-in-out infinite;
    transition: opacity 1.2s ease;
  }
  @keyframes markBreathe{ 0%,100%{ opacity:0.045; } 50%{ opacity:0.075; } }
  .invitation.lit .monogram{ animation-play-state: paused; opacity:0.1; }
  .invitation.dissolving .monogram{ opacity:0; transition: opacity 1s ease; }

  .composition{
    position:relative; z-index:5; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center;
    padding: calc(6.5vh + var(--safe-t)) 8vw calc(5.5vh + var(--safe-b));
    transition: transform 2.6s cubic-bezier(0.19,1,0.22,1), opacity 1.3s ease, filter 1.3s ease;
    will-change: transform, opacity;
  }
  .invitation.push-in .composition{ transform: scale(1.14); }
  .invitation.dissolving .composition{ opacity:0; filter: blur(7px);
    transition: opacity 1.25s ease, filter 1.25s ease, transform 2.6s cubic-bezier(0.19,1,0.22,1); }

  .date-row{ display:flex; flex-direction:column; align-items:center; gap:0.65rem; opacity:0; animation: riseIn 1.6s ease forwards 0.3s; position:relative; z-index:2; }
  @keyframes riseIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .date{ font-family:'Jost', sans-serif; font-weight:300; font-size: clamp(0.76rem,1.7vw,0.92rem);
    letter-spacing:0.32em; color: var(--ink-soft); padding-left:0.32em; }

  .divider{ width:118px; height:14px; position:relative; z-index:2; }
  .divider line{ stroke: var(--gold-line); stroke-width:1; }
  .divider .spark{ fill: var(--gold); }

  .mid-spacer{ flex:1 1 auto; min-height:1rem; }
  .mid-spacer.small{ flex:0 1 2.2vh; }
  .mid-spacer.tiny{ flex:0 1 1.4vh; }

  .name-line{
    position:relative; z-index:2;
    font-weight:600; letter-spacing:0.03em;
    background-image: linear-gradient(100deg, var(--ink) 38%, var(--gold-bright) 50%, var(--ink) 62%);
    background-size:260% 100%; background-position:120% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    animation: sweep 11s ease-in-out infinite alternate;
  }
  @keyframes sweep{ 0%{ background-position:130% 0; } 100%{ background-position:-30% 0; } }
  .invitation.lit .name-line{ animation-duration:2.1s;
    background-image: linear-gradient(100deg, var(--ink) 28%, var(--gold-bright) 50%, var(--ink) 72%); }

  .name-line .cap{ font-size: clamp(2.3rem,9vw,4.4rem); font-family:'Playfair Display', serif; }
  .name-line .rest{ font-size: clamp(1.5rem,6vw,2.9rem); font-family:'Playfair Display', serif; letter-spacing:0.05em; }

  .amp{
    position:relative; z-index:2;
    font-family:'Playfair Display', serif; font-style:italic; font-weight:500;
    font-size: clamp(1.5rem,5.6vw,2.5rem); color: var(--gold); margin: 0.06em 0;
    opacity:0.92; text-shadow: 0 0 10px rgba(240,217,160,0.35);
  }

  .subtitle{ position:relative; z-index:2; margin: clamp(0.9rem,2.6vw,1.4rem) 0 0; font-style:italic; font-weight:400;
    font-size: clamp(1.05rem,3vw,1.5rem); color: var(--ink-soft); max-width:16ch;
    animation: msgBreathe 7s ease-in-out infinite; }
  @keyframes msgBreathe{ 0%,100%{ opacity:0.86; } 50%{ opacity:1; } }

  .touch{ display:flex; flex-direction:column; align-items:center; gap:0.6rem;
    transition: opacity 0.65s ease, transform 0.65s ease; }
  .touch-text{ font-family:'Jost', sans-serif; font-weight:300; font-size: clamp(0.68rem,1.4vw,0.8rem);
    letter-spacing:0.34em; color: var(--gold); padding-left:0.34em; animation: touchBreathe 3.6s ease-in-out infinite; }
  @keyframes touchBreathe{ 0%,100%{ opacity:0.55; letter-spacing:0.32em; } 50%{ opacity:1; letter-spacing:0.36em; } }

  .touch-track{ position:relative; width:64px; height:2px; }
  .touch-line{ position:absolute; inset:0; background: linear-gradient(90deg, transparent, var(--gold-line), transparent); }
  .touch-dot{ position:absolute; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%;
    background: radial-gradient(circle, #FFF7E2 0%, var(--gold) 70%); box-shadow:0 0 6px rgba(240,217,160,0.8);
    animation: dotTravel 4.2s ease-in-out infinite; }
  @keyframes dotTravel{ 0%,100%{ left:2%; opacity:0.4; } 50%{ left:88%; opacity:1; } }

  .invitation.touch-hidden .touch{ opacity:0; transform: translateY(6px); }

  .particle-field{ position:absolute; inset:0; z-index:4; pointer-events:none; }
  .mote{ position:absolute; border-radius:50%; background: radial-gradient(circle, #FFF8E8 0%, var(--gold) 60%, rgba(176,138,78,0) 100%); opacity:0; }
  .glint-particle{ position:absolute; opacity:0; }
  .glint-particle svg{ width:100%; height:100%; }
  .dissolve-particle{ position:absolute; width:3px; height:3px; border-radius:50%;
    background: radial-gradient(circle, #FFFBEF 0%, var(--gold-bright) 55%, rgba(176,138,78,0) 100%); opacity:0; z-index:6; }

  .light-bridge{ position:absolute; inset:0; z-index:9;
    background: radial-gradient(circle at 50% 46%, #FFFBF1 0%, #F4E6C4 28%, rgba(244,230,196,0) 68%);
    opacity:0; transform: scale(0.4); pointer-events:none;
    transition: opacity 1.3s ease, transform 1.9s cubic-bezier(0.19,1,0.22,1); }
  .invitation.bridge-active .light-bridge{ opacity:1; transform: scale(2.4); }
  .invitation.bridge-fade .light-bridge{ opacity:0; transition: opacity 1.6s ease; }

  .video-layer{ position:absolute; inset:0; z-index:10; background:#151009; opacity:0;
    transition: opacity 1.6s ease; pointer-events:none; }
  .invitation.video-visible .video-layer{ opacity:1; pointer-events:auto; }
  .video-layer video{ width:100%; height:100%; object-fit:cover; display:block; }

  @media (max-width:480px){ .subtitle{ max-width:14ch; } }

  @media (prefers-reduced-motion: reduce){
    .name-line,.touch-text,.touch-dot,.monogram,.subtitle,.rays,.vignette,.frame .glint{ animation:none !important; }
    .composition,.bloom,.light-bridge,.video-layer,.branch,.touch,.frame,.foreground-leaf,.monogram{ transition-duration:0.5s !important; }
  }
</style>

<script>
(function(){
  const stage = document.getElementById('stage');
  const particleField = document.getElementById('particleField');
  const videoLayer = document.getElementById('videoLayer');
  const video = document.getElementById('openingVideo');

  function seedIdleMotes(){
    const count = 16;
    for (let i = 0; i < count; i++){
      const m = document.createElement('div');
      m.className = 'mote';
      const size = 1 + Math.random() * 1.7;
      m.style.width = size + 'px'; m.style.height = size + 'px';
      m.style.left = (Math.random() * 100) + 'vw';
      m.style.top = (14 + Math.random() * 72) + 'vh';
      const duration = 8 + Math.random() * 10, delay = Math.random() * 8, drift = 18 + Math.random() * 28;
      m.animate([
        { transform:'translateY(0px)', opacity:0 },
        { transform:'translateY(-'+(drift*0.5)+'px)', opacity:0.3, offset:0.5 },
        { transform:'translateY(-'+drift+'px)', opacity:0 }
      ], { duration: duration*1000, delay: delay*1000, iterations: Infinity, easing:'ease-in-out' });
      particleField.appendChild(m);
    }
    const sparkCount = 7;
    for (let i = 0; i < sparkCount; i++){
      const g = document.createElement('div');
      g.className = 'glint-particle';
      const size = 6 + Math.random() * 6;
      g.style.width = size+'px'; g.style.height = size+'px';
      g.style.left = (8 + Math.random()*84) + 'vw';
      g.style.top = (12 + Math.random()*70) + 'vh';
      g.innerHTML = '<svg viewBox="0 0 20 20"><use href="#sparkShape" fill="var(--gold-bright)"/></svg>';
      const duration = 3 + Math.random()*3, delay = Math.random()*5;
      g.animate([
        { opacity:0, transform:'scale(0.4)' },
        { opacity:0.85, transform:'scale(1)', offset:0.5 },
        { opacity:0, transform:'scale(0.4)' }
      ], { duration: duration*1000, delay: delay*1000, iterations: Infinity, easing:'ease-in-out' });
      particleField.appendChild(g);
    }
  }
  seedIdleMotes();

  setTimeout(() => stage.classList.add('revealed'), 50);

  let hasBegun = false;

  function spawnDissolveParticles(){
    const fieldRect = particleField.getBoundingClientRect();
    const centerX = fieldRect.width/2, centerY = fieldRect.height*0.44;
    const targets = document.querySelectorAll('.name-line .cap, .name-line .rest, .amp');
    targets.forEach((el, idx) => {
      const rect = el.getBoundingClientRect();
      for (let p=0;p<2;p++){
        const dot = document.createElement('div');
        dot.className = 'dissolve-particle';
        const startX = rect.left - fieldRect.left + rect.width*Math.random();
        const startY = rect.top - fieldRect.top + rect.height*Math.random();
        dot.style.left = startX+'px'; dot.style.top = startY+'px';
        particleField.appendChild(dot);
        const towardX = (centerX-startX)*(0.3+Math.random()*0.25);
        const towardY = (centerY-startY)*(0.2+Math.random()*0.2) - (28+Math.random()*36);
        const delay = idx*9 + Math.random()*260, duration = 1450 + Math.random()*950;
        dot.animate([
          { transform:'translate(0,0) scale(0.5)', opacity:0 },
          { transform:'translate('+(towardX*0.4)+'px,'+(towardY*0.4)+'px) scale(1)', opacity:0.95, offset:0.3 },
          { transform:'translate('+towardX+'px,'+towardY+'px) scale(0.2)', opacity:0 }
        ], { duration, delay, easing:'cubic-bezier(0.19,1,0.22,1)', fill:'forwards' });
      }
    });
  }

  function beginSequence(){
    if (hasBegun) return;
    hasBegun = true;
    stage.setAttribute('aria-disabled','true');
    video.load();

    stage.classList.add('lit');
    setTimeout(() => stage.classList.add('touch-hidden'), 250);
    setTimeout(() => stage.classList.add('push-in'), 650);
    setTimeout(() => { spawnDissolveParticles(); stage.classList.add('dissolving'); }, 1550);
    setTimeout(() => stage.classList.add('bridge-active'), 2050);
    setTimeout(() => {
      stage.classList.add('video-visible');
      const p = video.play();
      if (p && p.catch) p.catch(()=>{});
    }, 2850);
    setTimeout(() => stage.classList.add('bridge-fade'), 3900);
  }

  stage.addEventListener('click', beginSequence);
  stage.addEventListener('keydown', (e) => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); beginSequence(); } });
})();
</script>
